<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire - Projects</title>
    <meta name="description" content="A record of the projects, experiments, and creations crafted along my path.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="resources/images/favicon.png">
</head>
<body data-theme="light"> <!-- Default to light mode -->
    <div class="glow-bg"></div>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🪶Grimoire</h1>
                <p>A record of the projects, experiments, and creations crafted along my path.</p>
            </div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                <!-- Moon icon for light mode (to switch to dark) -->
                <svg id="moon-icon" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display: none;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <!-- Sun icon for dark mode (to switch to light) -->
                <svg id="sun-icon" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </header>

        <section class="controls">
            <div class="filters-row">
                <div class="search-wrapper">
                    <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search the grimoire..." autocomplete="off">
                </div>

                <div class="tag-input-container">
                    <div class="selected-tags" id="selected-tags"></div>
                    <div class="tag-input-wrapper">
                        <input type="text" id="tag-search-input" placeholder="Type to add a rune filter..." autocomplete="off">
                        <div class="tag-suggestions" id="tag-suggestions"></div>
                    </div>
                </div>
            </div>
        </section>

        <main class="spell-grid" id="spell-grid">
            <!-- Loading indicator -->
            <div class="loading" id="loading">Deciphering the spells...</div>
            <!-- Cards will be injected here -->
        </main>

        <footer>
            <p>Crafted with intention. Powered by the Grimoire README.</p>
            <p>&copy; 2026 Diego Esteban</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
